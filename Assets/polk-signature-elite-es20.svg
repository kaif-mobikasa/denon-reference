    <text x="200" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#dfbe86" text-anchor="middle" letter-spacing="0.06em">polk</text>
