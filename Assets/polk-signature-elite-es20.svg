    <rect x="106" y="41" width="188" height="278" rx="11" fill="none" stroke="#383c44" stroke-width="1.2"/>
    <rect x="115" y="50" width="170" height="260" rx="8" fill="#131418"/>

    <!-- Terylene Tweeter -->
    <circle cx="200" cy="100" r="24" fill="#0a0a0d" stroke="#252830" stroke-width="1.8"/>
    <circle cx="200" cy="100" r="10" fill="url(#es20Tweeter)"/>

    <!-- 6.5" Dynamic Balance Gold Woofer -->
    <circle cx="200" cy="210" r="60" fill="#181a1f" stroke="#333740" stroke-width="2.5"/>
    <circle cx="200" cy="210" r="52" fill="#0e0f12" stroke="#22252a" stroke-width="3"/>
    <circle cx="200" cy="210" r="46" fill="url(#es20GoldCone)"/>
